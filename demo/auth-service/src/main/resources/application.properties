#####################################################
# APPLICATION
#####################################################

spring.application.name=auth-service
server.port=8081

#####################################################
# DATABASE
#####################################################

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#####################################################
# JPA
#####################################################

spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#####################################################
# EUREKA
#####################################################

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#####################################################
# JWT
#####################################################

jwt.secret=CompleteBankAuthenticationServiceSecretKeyForJwtTokenGeneration2026
jwt.expiration=3600000
jwt.refresh-expiration=604800000

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#####################################################
# LOGGING
#####################################################

logging.level.com.completebank.auth=INFO
logging.level.org.springframework.security=INFO